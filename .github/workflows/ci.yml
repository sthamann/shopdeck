name: macOS checks
on:
  push:
  pull_request:
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test core and compile the app
        run: swift test --disable-sandbox
